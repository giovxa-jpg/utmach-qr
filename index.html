<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ciencia de Datos e Inteligencia Artificial | UTMACH</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Outfit:wght@300;400;600;700;800;900&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --utmach-blue: #025792;
            --utmach-bright: #0a84ff;
            --cyan-glow: #00f2fe;
            --sky-glow: #38bdf8;
            --indigo-glow: #6366f1;
            --bg-deep: #020712;
            --card-bg: rgba(6, 15, 32, 0.74);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-deep);
            background-image:
                radial-gradient(circle at 18% 20%, rgba(2, 87, 146, 0.35) 0%, transparent 45%),
                radial-gradient(circle at 82% 80%, rgba(0, 242, 254, 0.18) 0%, transparent 45%),
                radial-gradient(circle at 50% 50%, rgba(99, 102, 241, 0.12) 0%, transparent 60%);
            min-height: 100vh;
            min-height: 100dvh;
            overflow: hidden;
            font-family: 'Outfit', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            color: var(--text-main);
            perspective: 1200px;
        }

        /* Lienzo de fondo: Red Neuronal + Lluvia Cuántica de Datos */
        canvas#neural-canvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* Rejilla holográfica sutil de fondo */
        .cyber-grid {
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(0, 242, 254, 0.035) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 242, 254, 0.035) 1px, transparent 1px);
            background-size: 44px 44px;
            mask-image: radial-gradient(circle at center, black 30%, transparent 85%);
            -webkit-mask-image: radial-gradient(circle at center, black 30%, transparent 85%);
            z-index: 1;
            pointer-events: none;
        }

        /* Tarjeta principal con Glassmorphism de alto nivel y borde luminoso */
        .portal-card {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 580px;
            background: var(--card-bg);
            border-radius: 28px;
            padding: 38px 36px 32px;
            text-align: center;
            backdrop-filter: blur(22px) saturate(180%);
            -webkit-backdrop-filter: blur(22px) saturate(180%);
            border: 1px solid rgba(0, 242, 254, 0.24);
            box-shadow:
                0 25px 60px -15px rgba(0, 0, 0, 0.85),
                0 0 45px rgba(2, 87, 146, 0.35),
                inset 0 1px 1px rgba(255, 255, 255, 0.18);
            transform-style: preserve-3d;
            transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.25s ease;
            animation: cardEntrance 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            overflow: hidden;
        }

        @keyframes cardEntrance {
            0% {
                opacity: 0;
                transform: translateY(30px) scale(0.94);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* Esquinas tecnológicas tipo HUD */
        .hud-corner {
            position: absolute;
            width: 18px;
            height: 18px;
            border-color: var(--cyan-glow);
            opacity: 0.65;
            pointer-events: none;
        }
        .hud-tl { top: 14px; left: 14px; border-top: 2px solid; border-left: 2px solid; border-top-left-radius: 6px; }
        .hud-tr { top: 14px; right: 14px; border-top: 2px solid; border-right: 2px solid; border-top-right-radius: 6px; }
        .hud-bl { bottom: 14px; left: 14px; border-bottom: 2px solid; border-left: 2px solid; border-bottom-left-radius: 6px; }
        .hud-br { bottom: 14px; right: 14px; border-bottom: 2px solid; border-right: 2px solid; border-bottom-right-radius: 6px; }

        /* Insignia superior de estado */
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 16px;
            border-radius: 999px;
            background: rgba(2, 87, 146, 0.28);
            border: 1px solid rgba(0, 242, 254, 0.35);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.72rem;
            font-weight: 600;
            letter-spacing: 1.8px;
            text-transform: uppercase;
            color: #bae6fd;
            margin-bottom: 20px;
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.15);
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--cyan-glow);
            box-shadow: 0 0 10px var(--cyan-glow), 0 0 20px var(--cyan-glow);
            animation: pulseDot 1.6s ease-in-out infinite;
        }

        @keyframes pulseDot {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.4); opacity: 0.55; }
        }

        /* --- SELLO UTMACH CON HALO ORBITAL DE IA --- */
        .emblem-stage {
            position: relative;
            width: 176px;
            height: 176px;
            margin: 0 auto 10px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Resplandor radial detrás del sello */
        .emblem-aura {
            position: absolute;
            inset: 8px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0, 242, 254, 0.42) 0%, rgba(2, 87, 146, 0.5) 55%, transparent 75%);
            filter: blur(14px);
            animation: auraBreath 4s ease-in-out infinite;
        }

        @keyframes auraBreath {
            0%, 100% { transform: scale(0.96); opacity: 0.8; }
            50% { transform: scale(1.08); opacity: 1; }
        }

        /* Anillos orbitales SVG alrededor del sello */
        .orbital-svg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .orbit-cw {
            transform-origin: center;
            animation: rotateCW 18s linear infinite;
        }

        .orbit-ccw {
            transform-origin: center;
            animation: rotateCCW 12s linear infinite;
        }

        @keyframes rotateCW {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes rotateCCW {
            from { transform: rotate(360deg); }
            to { transform: rotate(0deg); }
        }

        /* Medallón del Sello Circular UTMACH */
        .seal-medallion {
            position: relative;
            width: 134px;
            height: 134px;
            border-radius: 50%;
            padding: 3px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.95), rgba(0, 242, 254, 0.8), rgba(2, 87, 146, 0.95));
            box-shadow:
                0 0 28px rgba(0, 242, 254, 0.45),
                0 10px 25px rgba(0, 0, 0, 0.65);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            z-index: 3;
            transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .portal-card:hover .seal-medallion {
            transform: scale(1.05);
        }

        .seal-medallion img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 50%;
            display: block;
            filter: contrast(1.04);
        }

        /* Brillo diagonal suave sobre el sello */
        .seal-medallion::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -60%;
            width: 45%;
            height: 200%;
            background: linear-gradient(
                to right,
                transparent 0%,
                rgba(255, 255, 255, 0.45) 50%,
                transparent 100%
            );
            transform: rotate(30deg);
            animation: sealSheen 5.5s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes sealSheen {
            0%, 65% { left: -65%; opacity: 0; }
            75% { opacity: 1; }
            100% { left: 135%; opacity: 0; }
        }

        /* Tipografía oficial UTMACH debajo del escudo */
        .utmach-wordmark-wrap {
            margin-top: 2px;
            margin-bottom: 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        .utmach-wordmark {
            height: 28px;
            width: auto;
            object-fit: contain;
            filter: drop-shadow(0 0 12px rgba(0, 242, 254, 0.45)) drop-shadow(0 2px 4px rgba(0, 0, 0, 0.8));
        }

        .utmach-sub {
            font-size: 0.72rem;
            letter-spacing: 2.8px;
            text-transform: uppercase;
            color: #93c5fd;
            font-weight: 600;
            opacity: 0.9;
        }

        /* --- TÍTULO PRINCIPAL: CIENCIA DE DATOS E INTELIGENCIA ARTIFICIAL --- */
        .welcome-label {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.82rem;
            font-weight: 700;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #cbd5e1;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .welcome-label::before,
        .welcome-label::after {
            content: '';
            height: 1px;
            width: 36px;
            background: linear-gradient(90deg, transparent, var(--cyan-glow));
        }

        .welcome-label::after {
            background: linear-gradient(90deg, var(--cyan-glow), transparent);
        }

        h1.career-title {
            font-size: clamp(1.75rem, 4.8vw, 2.5rem);
            font-weight: 900;
            line-height: 1.12;
            letter-spacing: -0.02em;
            margin-bottom: 18px;
            text-transform: uppercase;
        }

        h1.career-title .line-data {
            display: block;
            background: linear-gradient(135deg, #ffffff 0%, #bae6fd 45%, #38bdf8 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            filter: drop-shadow(0 4px 16px rgba(56, 189, 248, 0.25));
        }

        h1.career-title .line-amp {
            display: inline-block;
            font-size: 0.58em;
            font-weight: 700;
            color: var(--cyan-glow);
            vertical-align: middle;
            margin: 2px 6px;
            letter-spacing: 2px;
            text-shadow: 0 0 12px rgba(0, 242, 254, 0.6);
        }

        h1.career-title .line-ai {
            display: block;
            margin-top: 2px;
            background: linear-gradient(90deg, #00f2fe 0%, #38bdf8 35%, #818cf8 75%, #00f2fe 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: shimmerTitle 4.5s linear infinite;
            filter: drop-shadow(0 0 22px rgba(0, 242, 254, 0.38));
        }

        @keyframes shimmerTitle {
            to { background-position: 200% center; }
        }

        /* Píldoras de áreas tecnológicas */
        .tech-pills {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin-bottom: 24px;
        }

        .tech-pill {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
            color: #e0f2fe;
            background: rgba(15, 23, 42, 0.65);
            border: 1px solid rgba(56, 189, 248, 0.28);
            padding: 5px 12px;
            border-radius: 8px;
            letter-spacing: 0.5px;
            backdrop-filter: blur(4px);
            transition: all 0.25s ease;
        }

        .tech-pill:hover {
            border-color: var(--cyan-glow);
            box-shadow: 0 0 12px rgba(0, 242, 254, 0.3);
            transform: translateY(-1px);
        }

        /* --- SECCIÓN DE REDIRECCIÓN Y PROGRESO --- */
        .redirect-box {
            background: rgba(2, 8, 23, 0.62);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 18px;
            padding: 15px 18px;
            margin-bottom: 16px;
        }

        .redirect-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-size: 0.84rem;
            color: #cbd5e1;
        }

        .redirect-status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 500;
        }

        .spinner-ring {
            width: 14px;
            height: 14px;
            border: 2px solid rgba(0, 242, 254, 0.25);
            border-top-color: var(--cyan-glow);
            border-radius: 50%;
            animation: rotateCW 0.8s linear infinite;
        }

        .redirect-percent {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--cyan-glow);
        }

        .progress-track {
            width: 100%;
            height: 6px;
            background: rgba(15, 23, 42, 0.9);
            border-radius: 999px;
            overflow: hidden;
            position: relative;
            box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.6);
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            border-radius: 999px;
            background: linear-gradient(90deg, var(--utmach-blue), var(--sky-glow), var(--cyan-glow));
            box-shadow: 0 0 14px var(--cyan-glow);
            transition: width 0.08s linear;
        }

        /* Botón de acceso directo a Instagram */
        .ig-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 13px 24px;
            border-radius: 14px;
            background: linear-gradient(135deg, rgba(2, 87, 146, 0.9) 0%, rgba(0, 180, 216, 0.9) 100%);
            border: 1px solid rgba(0, 242, 254, 0.5);
            color: #ffffff;
            font-family: 'Outfit', sans-serif;
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-decoration: none;
            cursor: pointer;
            box-shadow: 0 8px 24px rgba(2, 87, 146, 0.45), 0 0 15px rgba(0, 242, 254, 0.2);
            transition: all 0.25s cubic-bezier(0.22, 1, 0.36, 1);
            position: relative;
            overflow: hidden;
        }

        .ig-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(0, 242, 254, 0.4), 0 0 25px rgba(0, 242, 254, 0.35);
            background: linear-gradient(135deg, #0369a1 0%, #06b6d4 100%);
        }

        .ig-button:active {
            transform: translateY(0);
        }

        .ig-button svg {
            width: 20px;
            height: 20px;
            flex-shrink: 0;
        }

        /* Responsividad para pantallas móviles */
        @media (max-width: 480px) {
            .portal-card {
                padding: 26px 20px 22px;
                border-radius: 24px;
            }
            .emblem-stage {
                width: 150px;
                height: 150px;
            }
            .seal-medallion {
                width: 112px;
                height: 112px;
            }
            .utmach-wordmark {
                height: 23px;
            }
            .status-badge {
                font-size: 0.64rem;
                padding: 5px 12px;
                margin-bottom: 14px;
            }
            .tech-pills {
                gap: 6px;
                margin-bottom: 18px;
            }
            .tech-pill {
                font-size: 0.65rem;
                padding: 4px 10px;
            }
        }
    </style>
</head>

        <!-- Barra de progreso de redirección -->
        <div class="redirect-box">
            <div class="redirect-header">
                <div class="redirect-status">
                    <div class="spinner-ring"></div>
                    <span>Redirigiendo a nuestro Instagram...</span>
                </div>
                <span class="redirect-percent" id="progress-text">0%</span>

        <a href="https://www.instagram.com/cienciadedatosia_utmach?mdxt=ZHgwejcyaGFtbXNi" class="ig-button" id="ig-link">

    <script>
        // =========================================================================
        // CONFIGURACIÓN DE ENLACE DE DESTINO
        // Reemplaza esta URL por el Instagram oficial de la carrera / UTMACH
        // =========================================================================
        const INSTAGRAM_URL = "https://www.instagram.com/cienciadedatosia_utmach?mdxt=ZHgwejcyaGFtbXNi";
        const REDIRECT_TIME_MS = 4800; // 4.8 segundos

        const igLink = document.getElementById('ig-link');
        igLink.href = INSTAGRAM_URL;

        // --- LÓGICA DE PROGRESO Y REDIRECCIÓN ---
        const progressFill = document.getElementById('progress-fill');
        const progressText = document.getElementById('progress-text');
        const startTime = performance.now();
        let redirected = false;

        function updateProgress(now) {
            const elapsed = now - startTime;
            const ratio = Math.min(elapsed / REDIRECT_TIME_MS, 1);
            // Curva suave para que el progreso se sienta orgánico y fluido
            const eased = 1 - Math.pow(1 - ratio, 2.2);
            const pct = Math.round(eased * 100);

            progressFill.style.width = (eased * 100).toFixed(1) + '%';
            progressText.textContent = pct + '%';

            if (ratio < 1) {
                requestAnimationFrame(updateProgress);
            } else if (!redirected) {
                redirected = true;
                window.location.href = INSTAGRAM_URL;
            }
        }
        requestAnimationFrame(updateProgress);

        // --- EFECTO 3D INTERACTIVO EN LA TARJETA ---
        const card = document.getElementById('portal-card');
        window.addEventListener('pointermove', (e) => {
            if (window.innerWidth < 600) return;
            const rect = card.getBoundingClientRect();
            const cx = rect.left + rect.width / 2;
            const cy = rect.top + rect.height / 2;
            const dx = (e.clientX - cx) / (window.innerWidth / 2);
            const dy = (e.clientY - cy) / (window.innerHeight / 2);
            card.style.transform = `rotateY(${dx * 5.5}deg) rotateX(${-dy * 5.5}deg)`;
        });

        window.addEventListener('pointerleave', () => {
            card.style.transform = 'rotateY(0deg) rotateX(0deg)';
        });

        // --- FONDO HÍBRIDO: FLUJO DE DATOS CUÁNTICOS + RED NEURONAL DE IA ---
        const canvas = document.getElementById('neural-canvas');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        const pointer = { x: width / 2, y: height / 2, active: false };
        window.addEventListener('pointermove', (e) => {
            pointer.x = e.clientX;
            pointer.y = e.clientY;
            pointer.active = true;
        });

        // 1. Columnas de flujo de símbolos de Ciencia de Datos e IA
        const symbols = ['0', '1', '0', '1', '∑', 'λ', '∇', 'π', 'AI', 'ML', '⊗', '∫'];
        const fontSize = 15;
        let columns = Math.ceil(width / 26);
        let drops = [];

        function initDrops() {
            columns = Math.ceil(width / 26);
            drops = Array.from({ length: columns }, () => ({
                y: Math.random() * -50,
                speed: 0.25 + Math.random() * 0.45,
                opacity: 0.08 + Math.random() * 0.18
            }));
        }

        // 2. Nodos de Red Neuronal Artificial (Grafo dinámico)
        let nodes = [];

        function initNodes() {
            const count = Math.min(Math.floor((width * height) / 18000), 65);
            nodes = Array.from({ length: count }, () => ({
                x: Math.random() * width,
                y: Math.random() * height,
                vx: (Math.random() - 0.5) * 0.65,
                vy: (Math.random() - 0.5) * 0.65,
                radius: 1.4 + Math.random() * 1.8,
                pulse: Math.random() * Math.PI * 2
            }));
        }

        initDrops();
        initNodes();

        function renderScene() {
            // Desvanecimiento suave del fotograma anterior
            ctx.fillStyle = 'rgba(2, 7, 18, 0.22)';
            ctx.fillRect(0, 0, width, height);

            // Dibujar flujo vertical de datos en segundo plano
            ctx.font = `600 ${fontSize}px "JetBrains Mono", monospace`;
            for (let i = 0; i < drops.length; i++) {
                const d = drops[i];
                const token = symbols[Math.floor(Math.random() * symbols.length)];
                const x = i * 26;
                const y = d.y * fontSize;

                ctx.fillStyle = `rgba(0, 242, 254, ${d.opacity})`;
                ctx.fillText(token, x, y);

                if (y > height && Math.random() > 0.98) {
                    d.y = -2;
                }
                d.y += d.speed;
            }

            // Actualizar y dibujar la Red Neuronal de IA
            const maxDist = 145;
            for (let i = 0; i < nodes.length; i++) {
                const n = nodes[i];
                n.x += n.vx;
                n.y += n.vy;
                n.pulse += 0.03;

                if (n.x < 0 || n.x > width) n.vx *= -1;
                if (n.y < 0 || n.y > height) n.vy *= -1;

                // Conexiones sinápticas entre nodos cercanos
                for (let j = i + 1; j < nodes.length; j++) {
                    const m = nodes[j];
                    const dx = n.x - m.x;
                    const dy = n.y - m.y;
                    const dist = Math.hypot(dx, dy);

                    if (dist < maxDist) {
                        const alpha = (1 - dist / maxDist) * 0.25;
                        ctx.strokeStyle = `rgba(56, 189, 248, ${alpha})`;
                        ctx.lineWidth = 1;
                        ctx.beginPath();
                        ctx.moveTo(n.x, n.y);
                        ctx.lineTo(m.x, m.y);
                        ctx.stroke();
                    }
                }

                // Interacción con el puntero
                if (pointer.active) {
                    const pdx = n.x - pointer.x;
                    const pdy = n.y - pointer.y;
                    const pdist = Math.hypot(pdx, pdy);
                    if (pdist < 180) {
                        const pAlpha = (1 - pdist / 180) * 0.45;
                        ctx.strokeStyle = `rgba(0, 242, 254, ${pAlpha})`;
                        ctx.lineWidth = 1.2;
                        ctx.beginPath();
                        ctx.moveTo(n.x, n.y);
                        ctx.lineTo(pointer.x, pointer.y);
                        ctx.stroke();
                    }
                }

                // Dibujar neurona brillante
                const glowAlpha = 0.5 + Math.sin(n.pulse) * 0.3;
                ctx.beginPath();
                ctx.arc(n.x, n.y, n.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(0, 242, 254, ${glowAlpha})`;
                ctx.fill();
            }

            requestAnimationFrame(renderScene);
        }

        requestAnimationFrame(renderScene);

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            initDrops();
            initNodes();
        });
    </script>
